<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Location Jump</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="map" aria-label="Map. Click to choose a location."></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
      </span>
      <span class="brand-name">Location Jump</span>
    </div>
    <div id="status" class="status status-unknown" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Looking for your iPhone…</span>
    </div>
  </header>

  <aside class="panel">
    <div class="grabber" aria-hidden="true"></div>

    <div id="alert" class="alert" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z"/></svg>
      <p id="alert-text"></p>
    </div>

    <section class="card now">
      <div class="eyebrow">
        <span id="sim-heading">Your iPhone is showing</span>
        <span class="eyebrow-actions">
          <span id="drift-badge" class="live" hidden><i></i>Drifting</span>
          <span id="reconnect-badge" class="live warn" hidden><i></i>Reconnecting</span>
          <button id="btn-star" class="icon-btn" title="Save to favorites" aria-label="Save to favorites" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.5Z"/></svg>
          </button>
        </span>
      </div>
      <div id="sim" class="sim">
        <div class="sim-title">Real location</div>
        <div class="sim-sub">Nothing simulated</div>
      </div>
    </section>

    <section class="card">
      <div class="eyebrow"><span>Destination</span></div>
      <div class="search" role="combobox" aria-haspopup="listbox" aria-owns="search-results" aria-expanded="false">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.24-1.4 1.4-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
        <input id="search" type="search" placeholder="Search a place or address" autocomplete="off" spellcheck="false"
               aria-autocomplete="list" aria-controls="search-results">
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>
      <p class="hint">Or tap the map, or type coordinates:</p>
      <div class="coords">
        <label class="field">
          <span>Latitude</span>
          <input id="lat" type="number" step="any" inputmode="decimal" placeholder="48.8584" autocomplete="off">
        </label>
        <label class="field">
          <span>Longitude</span>
          <input id="lon" type="number" step="any" inputmode="decimal" placeholder="2.2945" autocomplete="off">
        </label>
      </div>
      <button id="btn-set" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 3 3 10.5l7 2.5 2.5 7L21 3Z"/></svg>
        <span>Set Location</span>
      </button>
      <div class="btn-row">
        <button id="btn-random" class="btn btn-secondary" title="Jump to one of {{ place_count }} famous places">
          <span aria-hidden="true">🎲</span><span>Random Location</span>
        </button>
        <button id="btn-reset" class="btn btn-ghost">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
          <span>Reset to Real Location</span>
        </button>
      </div>
    </section>

    <section class="card toggle-card">
      <label class="switch-row" for="drift">
        <span>
          <span class="switch-title">Natural drift</span>
          <span class="hint">Wanders a few meters every ~5 seconds so the pin doesn't look frozen.</span>
        </span>
        <span class="switch">
          <input id="drift" type="checkbox" role="switch">
          <span class="track"><span class="thumb"></span></span>
        </span>
      </label>
    </section>

    <section class="card saved">
      <div class="eyebrow">
        <div class="tabs" role="tablist">
          <button id="tab-favorites" class="tab active" role="tab" aria-selected="true">Favorites</button>
          <button id="tab-recents" class="tab" role="tab" aria-selected="false">Recent</button>
        </div>
        <button id="btn-clear-recents" class="link-btn" hidden>Clear</button>
      </div>
      <ul id="saved-list" class="saved-list"></ul>
    </section>

    <footer class="panel-foot">{{ place_count }} famous places in the random list · runs only on this Mac</footer>
  </aside>

  <div id="message" class="toast" role="alert" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
