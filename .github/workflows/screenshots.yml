name: Screenshots

# Run by hand (Actions tab > Screenshots > Run workflow, pick a branch) to regenerate the
# README images. The new docs/screenshots/*.png are committed back to that branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/screenshots.py
      - name: Commit the new screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update README screenshots"
            git push
          fi
