name: Website

# Publishes the project website (site/ + screenshots) to GitHub Pages:
# https://iggyduenas.github.io/location-jump/
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "places.py", "static/vendor/**", "static/icon.png",
            "scripts/build_site.py", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
